<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Type Conversion</title>
</head>
<body>
    <script>
        "use strict"
        let age=18;
        alert(typeof age);
        alert(typeof String(age));

        let id="123z";
        let roll_no="    57 ";
        let Num_conv1=Number(id);
        alert(typeof Number(id));
        alert(typeof Number(roll_no));
        alert(Num_conv1);
        
        let name=null;
        let anime="JJK";
        alert(typeof Boolean(name));
        alert(typeof Boolean(anime));
    </script>
</body>
</html>
