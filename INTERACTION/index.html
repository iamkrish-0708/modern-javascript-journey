<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaction With User</title>
</head>
<body>
    <script>
        "use strict"
        let greet="welcome";
        alert(greet);

        let greet_user=prompt("Enter name","JANE DOE");
        alert(`welcome ${greet_user}`);

        let isHappy=confirm("Are you happy?");
        alert(isHappy);
    </script>
</body>
