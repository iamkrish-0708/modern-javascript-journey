<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nullish coalescing operator</title>
</head>
<body>
    <script>
        "use strict"
        let val1=null;
        let val2=undefined;
        let val3=3;
        alert(val1??val2??val3); // ?? returns first defined value
        // if null or undefined ?? ignores it
    </script>
</body>
</html>
