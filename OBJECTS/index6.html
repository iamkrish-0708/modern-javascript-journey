    <script>
        "use strict"
        const courseEnrollments = [

.filter(s => s.completed)

},0);
console.log(total);

const check=courseEnrollments.map(s=>`${s.course}`)

const completedEnrollments = courseEnrollments.filter(s => s.completed);

const avgRating = completedEnrollments.reduce((total, s) => total + s.rating, 0) / completedEnrollments.length;

console.log(avgRating);
