<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWITCH CASE</title>
</head>
<body>
    <script>
        "use strict"
        let q_o_d=prompt("ENTER A NUMBER FROM 1 TO 5 TO GET QUOTE OF THE DAY","__?__");
        switch(q_o_d){
            case '1':alert("“Success is the sum of small efforts, repeated day in and day out.”");break;
            case '2':alert("“The best way to predict the future is to create it.”");break;
            case '3':alert("“Difficult roads often lead to beautiful destinations.”");break;
            case '4':alert("“Don’t wait for opportunity. Create it.”");break;
            case '5':alert("“A little progress each day adds up to big results.”");break;
            default:alert("NUMBER SHOULD BE IN RANGE OF 1 TO 5.");
        }
    </script>
</body>
</html>
