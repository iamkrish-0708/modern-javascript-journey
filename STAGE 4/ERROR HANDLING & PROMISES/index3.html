<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        "use strict"
        const newUser={
            name:"Jason",
            username:"its_jason99",
            email:"jasongoat90@js.com"
        }

        async function registerUser() {
            try{
            const response=await fetch("https://jsonplaceholder.typicode.com/users",{
                method:"POST",
                headers:{
                    "Content-Type": "application/json"
                },
                body:JSON.stringify(newUser)
            });

            if(!response.ok){
                throw new Error(`Server rejected request with status: ${response.status}`);
            }
            
            const savedUser=await response.json();
    
    console.log("Success! Server registered user with emailID:", savedUser.email," | Name:",savedUser.name);

        }
        catch(error){
            console.error("Network or server error:", error.message);
    }
    }
    registerUser();
    
    </script>
</body>
</html>
