<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        "use strict"
        async function getPostWithComments() {
            try {
                const [res1,res2]=await Promise.all([fetch("https://jsonplaceholder.typicode.com/posts/1"),fetch("https://jsonplaceholder.typicode.com/comments?postId=1")]);

                if(!res1.ok||!res2.ok){
                    throw new Error("One or more server requests failed!");
                }

                const [data1,data2]=await Promise.all([res1.json(),res2.json()]);

                console.log(`Post Title: ${data1.title}`);
                console.log(`Total Comments: ${data2.length}`);
                console.log(`First Comment by: ${data2[0].email}`);
            } catch (error) {
                console.error("Server failed to load:", error.message);
            }
            
        }
        getPostWithComments();
    </script>
</body>
</html>
