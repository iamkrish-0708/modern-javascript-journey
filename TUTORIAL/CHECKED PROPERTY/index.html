<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHECKED PROPERTY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <input type="checkbox" id="check">
    <label for="check">Checkbox for students.</label>
    <br><hr>
    Select favourite subject among below options:
    <br>
    <input type="radio" id="r1" name="subject"> 
    <label for="r1">Mathematics</label> 
    <br>  
    <input type="radio" id="r2" name="subject">
    <label for="r2">Physics</label>
    <br>
    <input type="radio" id="r3" name="subject">
    <label for="r3">Chemistry</label>
    <br>
    <input type="radio" id="r4" name="subject">
    <label for="r4">None of the above</label>
    <br>
    <button id="btn">submit</button>
    <br>
    <label id="RESULT1"></label>
    <br>
    <label id="RESULT2"></label>

    <script src="script.js"></script>
</body>
</html>
