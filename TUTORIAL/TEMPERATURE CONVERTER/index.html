<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEMPERATURE CONVERTOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="MAIN">
        <h1 id="HEADING">TEMPERATURE CONVERTOR</h1><hr>
        <input type="text" id="TEMPIO">
        <label for="TEMPIO" id="LABEL1">ENTER TEMPERATURE</label>

<div class="option">
    <input type="radio" name="unit" id="toFahrenheit">
    <label for="toFahrenheit">CELSIUS TO FAHRENHEIT</label>
</div>

<div class="option">
    <input type="radio" name="unit" id="toCelsius">
    <label for="toCelsius">FAHRENHEIT TO CELSIUS</label>
</div>

<button id="SUBMIT">CALCULATE</button><hr>
<h4 id="RES">RESULT</h2><br>
<label id="RESULT"></label>
    </div>
    <script src="script.js"></script>
</body>
</html>
