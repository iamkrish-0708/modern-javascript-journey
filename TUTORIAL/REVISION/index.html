<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
    <script>
        class Cart{
            constructor(item,price){
                this.item=item;
                this.price=price;
            }
            static cart(cartInstance){
                console.log(`${cartInstance.item} for ${cartInstance.price} rs is added to cart.`);
            }
        }
        const purchase1=new Cart("Toothpaste",59);
        Cart.cart(purchase1);
    </script>
</body>
